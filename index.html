<head>
  <meta charset="utf-8" />

  <title>P01 多模型口径对比器</title>
    <link rel="stylesheet" href="../shared/design-tokens.css" />
<link rel="stylesheet" href="./modern-styles.css" />
<link rel="stylesheet" href="./styles.css" />
<meta name="description" content="神农尝百草多模型口径对比器。P01 多模型口径对比器" />
  <meta property="og:title" content="P01 神农尝百草多模型口径对比器" />
  <meta property="og:description" content="神农尝百草多模型口径对比器 — 前端纯静态新闻工具" />

<style media="print">
.gnav,.pedagogy-panel,.explore-section,[class*="dark-toggle"],button[aria-label]{display:none!important}
body{background:#fff!important;color:#000!important;font-size:11pt}
.app,main,.container{box-shadow:none!important;border:none!important;padding:0!important}
a{color:#000!important;text-decoration:underline}
a[href]::after{content:" (" attr(href) ")";font-size:9pt;color:#666}
@page{margin:2cm}
</style>
</head>
<body>
  <main aria-label="主内容区域" class="app">
    <header class="hero">
      <h1>神农尝百草多模型口径对比器</h1>
      <p>同一问题并发询问 3 个模型，直接比立场、偏见与幻觉。</p>
      <p class="note">BYOK 直连模式: API Key 只在当前页面内存中使用，不写入服务器。</p>
    </header>

    <section class="question">
      <details class="teach-card" open>
        <summary>🎓 如何使用多模型对比</summary>
        <p>将同一问题同时发送给不同 AI 模型，观察它们在<strong>立场倾向</strong>、<strong>事实幻觉</strong>、<strong>信源引用</strong>三个维度的差异。这是新闻学中“交叉核验”思维的 AI 时代延伸。</p>
      </details>
      <div style="margin-bottom:8px;display:flex;gap:6px;flex-wrap:wrap">
        <button type="button" class="example-btn" onclick="document.getElementById('questionInput').value='请分别用支持与反对视角评价城市坟地复拍政策。'">示例: 城市拆迁政策</button>
        <button type="button" class="example-btn" onclick="document.getElementById('questionInput').value='某能源巨头发布纯利润数据显示增长，但网上又有漏油事故报告。请综合分析这家公司的综合表现。'">示例: 企业 ESG 争议</button>
        <button type="button" class="example-btn" onclick="document.getElementById('questionInput').value='某市宣称空气质量达到历年最优，但居民反映雾霾很重。请分析可能的解释。'">示例: 数据与感受矛盾</button>
      </div>
      <label for="questionInput">采访问题</label>
      <textarea id="questionInput" rows="4" placeholder="例如: 请分别用支持与反对视角评价某项公共政策。"></textarea>
      <p id="status" role="status" aria-live="polite" class="status-hint">状态: 等待输入</p>
      <button id="runBtn" type="button">并发对比 3 模型</button>
    </section>

    <section class="grid" aria-label="模型对比面板">
      <article class="panel" data-panel="a">
        <h2>模型 A</h2>
        <div class="form-row">
          <label for="aEndpoint">Endpoint</label>
          <input class="endpoint" id="aEndpoint" type="url" placeholder="https://api.deepseek.com/chat/completions" />
        </div>
        <div class="form-row">
          <label for="aModel">Model</label>
          <input class="model" id="aModel" type="text" placeholder="deepseek-chat" />
        </div>
        <div class="form-row">
          <label for="aApiKey">API Key</label>
          <input class="apiKey" id="aApiKey" type="password" placeholder="sk-..." />
        </div>
        <div class="out" aria-live="polite">等待输入...</div>
      </article>

      <article class="panel" data-panel="b">
        <h2>模型 B</h2>
        <div class="form-row">
          <label for="bEndpoint">Endpoint</label>
          <input class="endpoint" id="bEndpoint" type="url" placeholder="https://api.moonshot.cn/v1/chat/completions" />
        </div>
        <div class="form-row">
          <label for="bModel">Model</label>
          <input class="model" id="bModel" type="text" placeholder="moonshot-v1-8k" />
        </div>
        <div class="form-row">
          <label for="bApiKey">API Key</label>
          <input class="apiKey" id="bApiKey" type="password" placeholder="sk-..." />
        </div>
        <div class="out" aria-live="polite">等待输入...</div>
      </article>

      <article class="panel" data-panel="c">
        <h2>模型 C</h2>
        <div class="form-row">
          <label for="cEndpoint">Endpoint</label>
          <input class="endpoint" id="cEndpoint" type="url" placeholder="https://api.openai.com/v1/chat/completions" />
        </div>
        <div class="form-row">
          <label for="cModel">Model</label>
          <input class="model" id="cModel" type="text" placeholder="gpt-4o-mini" />
        </div>
        <div class="form-row">
          <label for="cApiKey">API Key</label>
          <input class="apiKey" id="cApiKey" type="password" placeholder="sk-..." />
        </div>
        <div class="out" aria-live="polite">等待输入...</div>
      </article>
    </section>
  </main>
  <script src="./pm-metrics.js" defer></script>
<script src="./app.js" defer></script>

  <!-- Privacy Notice -->
  <div style="text-align:center;padding:12px 16px;font-size:12px;color:#888;border-top:1px solid #eee;margin-top:24px;">
    🔒 隐私提示：本工具无自建服务器，数据仅由浏览器直连你所配置的模型服务商，请自行保管 API Key。
  </div>

    <a href="https://yuuqq.github.io/journalism-toolbox/" style="text-decoration:none;">📋 工具箱导航</a>
    <span style="opacity:.4">P01</span>
  </nav>

</body>
</html>
